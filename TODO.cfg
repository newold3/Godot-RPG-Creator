item1="Weathers:

1. Atmósferas de Misterio: Niebla y Bruma (Fog & Mist)
Es el efecto más usado después de la lluvia. Fundamental para bosques oscuros, pantanos venenosos o pueblos fantasma.

Variaciones: Niebla blanca espesa (Silent Hill), Bruma verde/morada venenosa flotando a ras de suelo, o neblina mágica azulada.

Técnica: Un ColorRect a pantalla completa con un shader de ruido fractal (FBM) desplazándose lentamente, o varias capas de sprites de nubes semitransparentes moviéndose a distintas velocidades para dar paralaje.

2. Entornos Hostiles: Cenizas y Ascuas (Ash & Embers)
Obligatorio para zonas volcánicas, aldeas siendo atacadas, o el páramo del jefe final.

Variaciones: Lluvia de ceniza gris densa, o brasas rojas/naranjas flotando hacia arriba.

Técnica: Partículas (GPUParticles2D) flotando en direcciones erráticas. Las ascuas pueden tener un poco de auto-iluminación (glow) o destellos esporádicos en su tiempo de vida.

3. Emoción y Paz: Caída de Hojas o Pétalos (Falling Leaves / Sakura)
Un clásico absoluto de los RPGs asiáticos, zonas de elfos o pueblos pacíficos. Aporta un tono melancólico o romántico instantáneo.

Variaciones: Hojas naranjas/secas de otoño, pétalos de cerezo rosa, o dientes de león en primavera.

Técnica: Es un sistema de partículas que requiere una física particular: caída lenta y un \"meceo\" (wobble) lateral constante, simulando la resistencia del aire.

4. Magia Nocturna: Luciérnagas y Polvo Estelar (Fireflies & Magic Dust)
Perfecto para cuevas de cristal, bosques de hadas de noche o santuarios sagrados.

Variaciones: Luciérnagas amarillas parpadeantes, esporas azules brillantes, o luces flotantes doradas.

Técnica: Partículas que no caen, sino que se mueven con órbitas orgánicas suaves y tienen un ciclo de opacidad (fade in / fade out) para simular el parpadeo.

5. Profundidad Masiva: Sombras de Nubes (Cloud Shadows)
A diferencia de los demás climas, este no ensucia el aire con partículas. Consiste en proyectar enormes sombras oscuras que se deslizan por el suelo del mapa. Transmite la sensación de estar en un mundo abierto masivo y vivo.

Técnica: Un CanvasModulate o Sprite gigante superpuesto (con el blend mode en Multiply o Substract) moviendo texturas de nubes, configurado para afectar solo al suelo y no al jugador."

